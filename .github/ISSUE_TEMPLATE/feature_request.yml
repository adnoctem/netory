name: 🚀 Feature request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Each service's scope is set by its design document in `docs/design/`, including an explicit
        out-of-scope list. Please check the relevant one first - a request that the design document
        rules out needs an argument against that decision rather than a restatement of the request.
  - type: dropdown
    attributes:
      label: Which service?
      options:
        - protean (dynDNS control plane)
        - signpost (script router)
        - pivot (API proxy)
        - shared pkg/ or build harness
    validations:
      required: true
  - type: textarea
    attributes:
      label: What problem does this solve?
      description: The situation you are in, rather than the implementation you have in mind.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What solution would you suggest?
  - type: textarea
    attributes:
      label: What alternatives have you considered?
